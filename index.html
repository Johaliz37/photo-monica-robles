<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sesiones de Navidad 2026 · Mónica Robles Fotografía</title>
    <meta
      name="description"
      content="Sesiones de fotos de Navidad 2026 en familia con Mónica Robles Fotografía, en Espadilla (Castellón). Consulta los paquetes y reserva tu sesión online."
    />
    <meta name="theme-color" content="#f5ede1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / WhatsApp / Instagram. El plugin "seo" de vite.config.ts añade og:url,
         canonical y URLs absolutas si se define VITE_SITE_URL -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Mónica Robles Fotografía" />
    <meta property="og:title" content="Sesiones de Navidad 2026 · Mónica Robles Fotografía" />
    <meta
      property="og:description"
      content="Sesiones de fotos de Navidad en familia. Preventa del 11 al 16 de octubre con un 10 % de descuento."
    />
    <meta property="og:image" content="/img/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Paquetes de Navidad 2026 de Mónica Robles Fotografía" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Imagen del hero (LCP de la home): se pide antes de que cargue el JavaScript -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/img/hero-1055.webp"
      imagesrcset="/img/hero-640.webp 640w, /img/hero-1055.webp 1055w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Mónica Robles Fotografía",
        "description": "Fotografía familiar e infantil. Sesiones de Navidad 2026.",
        "image": "/img/og-cover.jpg",
        "sameAs": ["https://www.instagram.com/monicarobles_fotografia/"],
        "areaServed": [
          { "@type": "City", "name": "Castellón de la Plana" },
          { "@type": "City", "name": "Vila-real" },
          { "@type": "City", "name": "Espadilla" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Castellón",
          "addressCountry": "ES"
        },
        "currenciesAccepted": "EUR"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
