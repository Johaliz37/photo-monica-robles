# Cloudflare Workers con static assets (sin código de Worker, solo la SPA de dist/)
name = "photo-monica-robles"
compatibility_date = "2026-10-01"

# wrangler deploy / versions upload compilan antes de subir (scripts/build.mjs elige el Supabase según la rama)
[build]
command = "node scripts/build.mjs"

[assets]
directory = "./dist"
# Rutas desconocidas (/reservar, /admin/...) sirven index.html con 200
not_found_handling = "single-page-application"
